<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>せんむすび きょうりゅう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@800&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#7cc8f2; --sky2:#e3f6ff; --sun:#ffd23f; --hill1:#78c850; --hill2:#a8dc7c;
  --mount:#a0735a; --card:#ffffff; --ink:#3a3a5c; --bg:#bfe8ff; --cardsize:120px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sky1:#33347a; --sky2:#f4a07a; --sun:#ffb347; --hill1:#3f8040; --hill2:#5c9c50;
    --mount:#6b4a3a; --card:#fffdf4; --bg:#33347a;
  }
}
:root[data-theme="dark"]{
  --sky1:#33347a; --sky2:#f4a07a; --sun:#ffb347; --hill1:#3f8040; --hill2:#5c9c50;
  --mount:#6b4a3a; --card:#fffdf4; --bg:#33347a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{
  background:var(--bg); overflow:hidden; color:var(--ink);
  font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  font-weight:800;
  touch-action:none; -webkit-user-select:none; user-select:none;
  -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
}

/* 背景の景色 */
#scene{position:fixed;inset:0;z-index:0}
#scene svg{width:100%;height:100%;display:block}
.cloud{animation:drift 70s linear infinite}
.cloud.b{animation-duration:95s;animation-delay:-40s}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(1400px)}}

/* 恐竜 */
#dino{
  position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 1vh);
  width:min(94vw,112vh); transform:translateX(-50%); z-index:1;
  transition:opacity .8s ease, filter 1.4s ease;
}
#dino svg{width:100%;height:auto;display:block;transform-origin:50% 90%}
#dino.hint{filter:brightness(0);opacity:var(--p,.06)}
#dino.reveal{filter:none;opacity:1;animation:rise 1.3s cubic-bezier(.2,1.5,.4,1) both;cursor:pointer}
@keyframes rise{
  0%{transform:translateX(-50%) translateY(8%) scale(.75)}
  100%{transform:translateX(-50%) translateY(0) scale(1)}
}
#dino.hop svg{animation:hop .7s ease}
@keyframes hop{
  25%{transform:translateY(-9%) scale(1.03,1.06)}
  55%{transform:translateY(0) scale(1.06,.92)}
  75%{transform:scale(.98,1.03)}
}

/* ゲーム盤 */
#board{
  position:fixed; z-index:2; display:flex; justify-content:space-between;
  top:calc(env(safe-area-inset-top,0px) + 58px);
  bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  left:calc(env(safe-area-inset-left,0px) + 14px);
  right:calc(env(safe-area-inset-right,0px) + 14px);
  transition:opacity .5s ease .2s;
}
.col{display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;height:100%}
.card{
  width:var(--cardsize); height:var(--cardsize); position:relative;
  background:var(--card); border-radius:30%; border:6px solid #fff;
  box-shadow:0 7px 0 rgba(40,60,90,.18);
  transition:transform .15s ease, box-shadow .15s ease;
}
.art{position:absolute;inset:11%;pointer-events:none}
.art svg{width:100%;height:100%;display:block}
.dot{
  position:absolute; top:50%; width:30px; height:30px; margin-top:-15px;
  border-radius:50%; background:#fff; border:6px solid var(--ink);
  animation:pulse 1.6s ease-in-out infinite; pointer-events:none;
}
.left .dot{right:-17px}
.right .dot{left:-17px}
@keyframes pulse{50%{transform:scale(1.25)}}
.card.active,.card.hover{transform:scale(1.1);box-shadow:0 0 0 7px #ffd23f,0 7px 0 rgba(40,60,90,.18)}
.card.done{border-color:var(--c);animation:yay .55s ease}
.card.done .dot{background:var(--c);border-color:#fff;animation:none}
.card.nope{animation:shake .42s ease}
@keyframes yay{35%{transform:scale(1.18) rotate(-5deg)}70%{transform:scale(.96) rotate(2deg)}}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}

#lines{position:fixed;inset:0;width:100%;height:100%;z-index:3;pointer-events:none;transition:opacity .5s}

body.won #board,body.won #lines,body.won #top{opacity:0;pointer-events:none}

/* 上のボタン(保護者用) */
#top{
  position:fixed; z-index:5; left:50%; transform:translateX(-50%);
  top:calc(env(safe-area-inset-top,0px) + 10px); display:flex; gap:10px; transition:opacity .4s;
}
#top button{
  font:inherit; font-size:16px; padding:8px 18px; border:none; border-radius:999px;
  background:rgba(255,255,255,.88); color:var(--ink); box-shadow:0 3px 0 rgba(40,60,90,.15);
}

/* できた！ */
#title{
  position:fixed; z-index:6; left:0; right:0; text-align:center; pointer-events:none;
  top:calc(env(safe-area-inset-top,0px) + 3vh);
  opacity:0; transform:translateY(-24px) scale(.9); transition:all .5s cubic-bezier(.2,1.5,.4,1);
}
#title.show{opacity:1;transform:none}
#title h1{
  margin:0; font-size:clamp(44px,10vw,96px); color:#ff6b6b; letter-spacing:.06em;
  text-shadow:0 0 0 #fff,4px 4px 0 #fff,-4px 4px 0 #fff,4px -4px 0 #fff,-4px -4px 0 #fff,0 10px 0 rgba(40,60,90,.15);
}
#title p{
  display:inline-block; margin:6px 0 0; padding:6px 22px; border-radius:999px;
  background:#fff; font-size:clamp(20px,4.6vw,36px); color:var(--ink);
}
#next{
  position:fixed; z-index:6; font:inherit; font-size:clamp(22px,5vw,34px);
  right:calc(env(safe-area-inset-right,0px) + 18px); bottom:calc(env(safe-area-inset-bottom,0px) + 18px);
  padding:14px 34px; border:none; border-radius:999px; color:#fff; background:#ff924c;
  box-shadow:0 7px 0 #d8692a; opacity:0; pointer-events:none; transform:translateY(20px); transition:all .4s;
}
#next.show{opacity:1;pointer-events:auto;transform:none;animation:nudge 1.8s ease-in-out 1.2s infinite}
#next:active{transform:translateY(5px);box-shadow:0 2px 0 #d8692a}
@keyframes nudge{50%{transform:scale(1.07)}}

.confetti{position:fixed;top:-24px;width:13px;height:19px;border-radius:4px;z-index:7;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(760deg)}}
.spark{
  position:fixed;width:22px;height:22px;margin:-11px 0 0 -11px;z-index:8;pointer-events:none;
  background:#ffd23f;clip-path:polygon(50% 0,62% 38%,100% 38%,69% 61%,81% 100%,50% 76%,19% 100%,31% 61%,0 38%,38% 38%);
  animation:spark .65s ease-out forwards;
}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.3) rotate(180deg);opacity:0}}

@media (prefers-reduced-motion: reduce){
  .cloud,.dot,#next.show{animation:none}
}
</style>
</head>

const $ = s => document.querySelector(s);
const board=$('#board'), leftCol=$('#leftCol'), rightCol=$('#rightCol'), linesG=$('#linesG'), dinoEl=$('#dino');
function load(k,d){try{const v=localStorage.getItem('senmusubi_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}}
function save(k,v){try{localStorage.setItem('senmusubi_'+k,JSON.stringify(v))}catch(e){}}
let pairCount = load('n',3), soundOn = load('snd',true);
let dinoIdx = Math.floor(Math.random()*DINOS.length);
let matched=0, links=[], drag=null, won=false, colorOf={};

const shuffle = a => {a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};

/* ===== おと ===== */
let actx=null;
function ac(){
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    if(actx.state==='suspended') actx.resume();
  }catch(e){}
  return actx;
}
function tone(f,t0,d,type,v,f2){
  const a=ac(); if(!a||!soundOn) return;
  const t=a.currentTime+t0, o=a.createOscillator(), g=a.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(v||.2,t+.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+d+.05);
}
const tick  = ()=>tone(880,0,.07,'sine',.08);
const boing = ()=>tone(340,0,.32,'triangle',.22,150);
function chime(i){const b=[523.25,587.33,659.25,783.99,880][i%5];tone(b,0,.3,'sine',.25);tone(b*1.5,.09,.35,'sine',.18);tone(b*2,.18,.45,'triangle',.1)}
function fanfare(){[523,659,784,1047].forEach((f,i)=>tone(f,.25+i*.13,.3,'triangle',.22));[523,659,784].forEach(f=>tone(f,.8,1.2,'sine',.12))}
function roar(){tone(170,0,.7,'sawtooth',.07,70);tone(110,0,.7,'triangle',.18,60)}
function speak(t){
  if(!soundOn||!('speechSynthesis' in window)) return;
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang='ja-JP';u.rate=.9;u.pitch=1.25;speechSynthesis.speak(u)}catch(e){}
}

/* ===== 線 ===== */
const NS='http://www.w3.org/2000/svg';
function makeLine(color){
  const g=document.createElementNS(NS,'g');
  const o=document.createElementNS(NS,'line'), l=document.createElementNS(NS,'line'), c=document.createElementNS(NS,'circle');
  o.setAttribute('stroke','#fff'); o.setAttribute('stroke-width','20'); o.setAttribute('stroke-linecap','round');
  l.setAttribute('stroke',color); l.setAttribute('stroke-width','11'); l.setAttribute('stroke-linecap','round');
  c.setAttribute('r','13'); c.setAttribute('fill',color); c.setAttribute('stroke','#fff'); c.setAttribute('stroke-width','5');
  g.append(o,l,c); linesG.appendChild(g); return g;
}
function setLine(g,a,b){
  g.querySelectorAll('line').forEach(el=>{el.setAttribute('x1',a.x);el.setAttribute('y1',a.y);el.setAttribute('x2',b.x);el.setAttribute('y2',b.y)});
  const c=g.querySelector('circle'); c.setAttribute('cx',b.x); c.setAttribute('cy',b.y);
}
function dotPos(card){const r=card.querySelector('.dot').getBoundingClientRect();return{x:r.left+r.width/2,y:r.top+r.height/2}}
function redraw(){links.forEach(k=>setLine(k.g,dotPos(k.a),dotPos(k.b)))}

/* ===== ラウンド ===== */
function render(col,arr,side){
  col.innerHTML='';
  arr.forEach(it=>{
    const c=document.createElement('div');
    c.className='card'; c.dataset.key=it.k; c.dataset.side=side; c.setAttribute('aria-label',it.n);
    c.innerHTML=`<div class="art">${it.svg}</div><span class="dot"></span>`;
    col.appendChild(c);
  });
}
function setProgress(){dinoEl.style.setProperty('--p',(.06+.3*matched/pairCount).toFixed(3))}
function sizeCards(){
  const h=board.clientHeight, w=board.clientWidth;
  const s=Math.max(60,Math.min(h/pairCount-20,w*.27,190));
  document.documentElement.style.setProperty('--cardsize',s+'px');
  requestAnimationFrame(redraw);
}
function newRound(){
  won=false; matched=0; links=[]; drag=null; linesG.innerHTML='';
  document.body.classList.remove('won'); $('#title').classList.remove('show'); $('#next').classList.remove('show');
  const picks=shuffle(ITEMS).slice(0,pairCount);
  colorOf={}; picks.forEach((it,i)=>colorOf[it.k]=COLORS[i]);
  const L=shuffle(picks); let R=shuffle(picks), tries=0;
  while(pairCount>1 && R.some((x,i)=>x===L[i]) && tries++<30) R=shuffle(picks);
  render(leftCol,L,'L'); render(rightCol,R,'R');
  dinoEl.className='hint'; dinoEl.innerHTML=DINOS[dinoIdx].svg; setProgress();
  $('#countBtn').textContent='かず '+pairCount;
  $('#soundBtn').textContent=soundOn?'🔊':'🔇';
  sizeCards();
}

/* ===== タッチ操作 ===== */
function findTarget(x,y,side){
  let best=null, bestD=Infinity;
  document.querySelectorAll(`.card[data-side="${side==='L'?'R':'L'}"]:not(.done)`).forEach(c=>{
    const r=c.getBoundingClientRect();
    const dx=Math.max(r.left-x,0,x-r.right), dy=Math.max(r.top-y,0,y-r.bottom);
    const d=Math.hypot(dx,dy);
    if(d<r.width*.45 && d<bestD){best=c;bestD=d}
  });
  return best;
}
function clearHover(){document.querySelectorAll('.card.hover').forEach(c=>c.classList.remove('hover'))}

board.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.card');
  if(!card||card.classList.contains('done')||drag||won) return;
  e.preventDefault(); ac(); tick();
  const p=dotPos(card), g=makeLine('#3a3a5c'); setLine(g,p,p);
  drag={card,id:e.pointerId,p,g}; card.classList.add('active');
});
window.addEventListener('pointermove',e=>{
  if(!drag||e.pointerId!==drag.id) return;
  setLine(drag.g,drag.p,{x:e.clientX,y:e.clientY});
  const t=findTarget(e.clientX,e.clientY,drag.card.dataset.side);
  clearHover(); if(t) t.classList.add('hover');
});
function endDrag(e){
  if(!drag||e.pointerId!==drag.id) return;
  const {card,g}=drag; drag=null; clearHover(); card.classList.remove('active');
  const t=e.type==='pointerup'?findTarget(e.clientX,e.clientY,card.dataset.side):null;
  if(t && t.dataset.key===card.dataset.key){
    const color=colorOf[card.dataset.key];
    const a=card.dataset.side==='L'?card:t, b=card.dataset.side==='L'?t:card;
    g.remove(); const pg=makeLine(color); setLine(pg,dotPos(a),dotPos(b));
    links.push({a,b,g:pg});
    [a,b].forEach(c=>{c.style.setProperty('--c',color);c.classList.add('done')});
    chime(matched); burst(dotPos(t)); matched++; setProgress();
    if(matched===pairCount) win();
  }else{
    g.remove();
    if(t){boing();[card,t].forEach(c=>{c.classList.remove('nope');void c.offsetWidth;c.classList.add('nope')})}
  }
}
window.addEventListener('pointerup',endDrag);
window.addEventListener('pointercancel',endDrag);
document.addEventListener('gesturestart',e=>e.preventDefault());

/* ===== できた！ ===== */
function burst(p){
  for(let i=0;i<8;i++){
    const s=document.createElement('span'); s.className='spark';
    const a=i/8*Math.PI*2, r=60+Math.random()*30;
    s.style.left=p.x+'px'; s.style.top=p.y+'px';
    s.style.setProperty('--dx',Math.cos(a)*r+'px'); s.style.setProperty('--dy',Math.sin(a)*r+'px');
    document.body.appendChild(s); setTimeout(()=>s.remove(),700);
  }
}
function confetti(){
  const cs=['#ff595e','#ffca3a','#8ac926','#1982c4','#9b5de5','#ff924c'];
  for(let i=0;i<60;i++){
    const s=document.createElement('span'); s.className='confetti';
    s.style.left=Math.random()*100+'vw'; s.style.background=cs[i%cs.length];
    s.style.animationDuration=(2.2+Math.random()*1.8)+'s'; s.style.animationDelay=(Math.random()*.8)+'s';
    document.body.appendChild(s); setTimeout(()=>s.remove(),5000);
  }
}
function win(){
  won=true; const d=DINOS[dinoIdx];
  speak(`できたね！ ${d.n}だよ！`); fanfare();
  setTimeout(()=>{document.body.classList.add('won');dinoEl.className='reveal';confetti()},450);
  setTimeout(()=>{$('#dinoName').textContent=d.n;$('#title').classList.add('show');$('#next').classList.add('show')},1300);
}
dinoEl.addEventListener('pointerdown',()=>{
  if(!won) return; ac(); roar();
  dinoEl.classList.remove('hop'); void dinoEl.offsetWidth; dinoEl.classList.add('hop');
});
$('#next').addEventListener('click',()=>{ac();tick();dinoIdx=(dinoIdx+1)%DINOS.length;newRound()});

/* ===== 保護者ボタン ===== */
$('#countBtn').addEventListener('click',()=>{pairCount=pairCount>=5?2:pairCount+1;save('n',pairCount);newRound()});
$('#soundBtn').addEventListener('click',()=>{soundOn=!soundOn;save('snd',soundOn);$('#soundBtn').textContent=soundOn?'🔊':'🔇';if(soundOn){ac();tick()}});

window.addEventListener('resize',sizeCards);
window.addEventListener('orientationchange',()=>setTimeout(sizeCards,300));
newRound();
</script>
</body>
</html>
